<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Admin | IAYA</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-nav="admin">
  <div data-header></div>

  <div class="admin-shell">
    <aside class="admin-side">
      <h4>Manage</h4>
      <a data-view="dashboard" class="active">대시보드</a>
      <a data-view="notices">공지사항 관리</a>
      <a data-view="contests">대회 관리</a>
      <a data-view="users">회원 관리</a>
    </aside>

    <main class="admin-main" data-admin-main>
      <!-- rendered by script -->
    </main>
  </div>

  <!-- Notice editor modal -->
  <div class="modal-backdrop" data-notice-modal>
    <div class="modal">
      <button class="close" data-close aria-label="닫기">×</button>
      <h2 data-title>공지 작성</h2>
      <div style="margin-top:20px;">
        <div class="field">
          <label>제목</label>
          <input type="text" data-n-title />
        </div>
        <div class="form-row">
          <div class="field">
            <label>카테고리</label>
            <select data-n-cat>
              <option value="important">중요</option>
              <option value="notice" selected>공지</option>
              <option value="event">행사</option>
              <option value="press">보도</option>
            </select>
          </div>
          <div class="field">
            <label>날짜</label>
            <input type="date" data-n-date />
          </div>
        </div>
        <div class="field">
          <label>내용</label>
          <div class="rich-toolbar" data-toolbar-for="data-n-body">
            <button type="button" data-tool="p">단락</button>
            <button type="button" data-tool="h3">소제목</button>
            <button type="button" data-tool="b">굵게</button>
            <button type="button" data-tool="a">링크</button>
            <button type="button" data-tool="ul">목록</button>
            <button type="button" data-tool="table">표 삽입</button>
            <button type="button" data-tool="img">이미지</button>
            <button type="button" data-tool="br">줄바꿈</button>
          </div>
          <textarea data-n-body rows="10" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;"></textarea>
          <div class="hint">HTML 태그 사용 가능. 위 버튼으로 자주 쓰는 요소를 자동 삽입할 수 있습니다.</div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button class="btn btn-ghost btn-sm" data-close>취소</button>
          <button class="btn btn-primary btn-sm" data-n-save>저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Contest editor modal -->
  <div class="modal-backdrop" data-contest-modal>
    <div class="modal">
      <button class="close" data-close aria-label="닫기">×</button>
      <h2 data-title>대회 등록</h2>
      <div style="margin-top:20px;">
        <div class="form-row">
          <div class="field"><label>대회명</label><input type="text" data-c-title /></div>
          <div class="field"><label>부문</label><input type="text" data-c-cat placeholder="예: 소설·에세이·시" /></div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>상태</label>
            <select data-c-status>
              <option value="open">진행 중</option>
              <option value="upcoming">예정</option>
              <option value="closed">종료</option>
            </select>
          </div>
          <div class="field"><label>기간</label><input type="text" data-c-period placeholder="예: 2026-09-01 ~ 2026-10-31" /></div>
        </div>
        <div class="field"><label>시상</label><input type="text" data-c-award /></div>
        <div class="field"><label>요약 (카드에 표시)</label><textarea data-c-summary rows="3"></textarea></div>
        <div class="field">
          <label>상세</label>
          <div class="rich-toolbar" data-toolbar-for="data-c-detail">
            <button type="button" data-tool="p">단락</button>
            <button type="button" data-tool="h3">소제목</button>
            <button type="button" data-tool="b">굵게</button>
            <button type="button" data-tool="a">링크</button>
            <button type="button" data-tool="ul">목록</button>
            <button type="button" data-tool="table">표 삽입</button>
            <button type="button" data-tool="img">이미지</button>
            <button type="button" data-tool="br">줄바꿈</button>
          </div>
          <textarea data-c-detail rows="10" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;"></textarea>
          <div class="hint">HTML 태그 사용 가능. 이미지는 URL을 입력해 삽입합니다.</div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button class="btn btn-ghost btn-sm" data-close>취소</button>
          <button class="btn btn-primary btn-sm" data-c-save>저장</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    (async function () {
      // Gate. currentUser() must exist and be admin, otherwise redirect.
      const user = await window.Auth.requireAdmin("login.html");
      if (!user) return;

      const sideLinks = document.querySelectorAll(".admin-side a[data-view]");
      const main = document.querySelector("[data-admin-main]");
      const noticeModal = document.querySelector("[data-notice-modal]");
      const contestModal = document.querySelector("[data-contest-modal]");

      let editingNoticeId = null;
      let editingContestId = null;

      const catLabel = { important: "중요", notice: "공지", event: "행사", press: "보도" };
      const statusLabel = { open: "진행 중", upcoming: "예정", closed: "종료" };

      sideLinks.forEach((a) => {
        a.addEventListener("click", () => {
          sideLinks.forEach((x) => x.classList.remove("active"));
          a.classList.add("active");
          render(a.dataset.view);
        });
      });

      async function render(view) {
        if (view === "dashboard") await renderDashboard();
        else if (view === "notices") await renderNotices();
        else if (view === "contests") await renderContests();
        else if (view === "users") await renderUsers();
      }

      async function renderDashboard() {
        main.innerHTML = `<p style="padding:40px 0;color:var(--muted);">불러오는 중…</p>`;
        const [notices, contests, users] = await Promise.all([
          window.IAYA.getNotices(),
          window.IAYA.getContests(),
          window.IAYA.getUsers(),
        ]);
        const openContests = contests.filter((c) => c.status === "open").length;
        main.innerHTML = `
          <div class="page-head">
            <div>
              <h2>관리자 대시보드</h2>
              <p style="color:var(--muted);font-size:14px;margin-top:4px;">환영합니다, ${escapeHtml(user.name)}님.</p>
            </div>
          </div>
          <div class="kpi-grid">
            <div class="kpi"><div class="label">전체 회원</div><div class="value">${users.length}</div><div class="delta">활성 계정</div></div>
            <div class="kpi"><div class="label">공지 총 개수</div><div class="value">${notices.length}</div></div>
            <div class="kpi"><div class="label">진행 중 대회</div><div class="value">${openContests}</div></div>
            <div class="kpi"><div class="label">등록 대회</div><div class="value">${contests.length}</div></div>
          </div>
          <div class="grid grid-2">
            <div class="card">
              <h3 style="margin-bottom:12px;">최근 공지</h3>
              ${notices.slice(0, 4).map((n) => `<div style="padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;">${escapeHtml(n.title)} <span style="color:var(--muted);font-size:12px;margin-left:8px;">${n.date}</span></div>`).join("")}
            </div>
            <div class="card">
              <h3 style="margin-bottom:12px;">최근 회원</h3>
              ${users.slice(0, 4).map((u) => `<div style="padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;">${escapeHtml(u.name)} <span style="color:var(--muted);font-size:12px;margin-left:8px;">${escapeHtml(u.email)}</span></div>`).join("")}
            </div>
          </div>
        `;
      }

      async function renderNotices() {
        main.innerHTML = `<p style="padding:40px 0;color:var(--muted);">불러오는 중…</p>`;
        const items = await window.IAYA.getNotices();
        main.innerHTML = `
          <div class="page-head">
            <h2>공지사항 관리</h2>
            <button class="btn btn-primary btn-sm" data-new-notice>+ 새 공지</button>
          </div>
          <table class="table">
            <thead>
              <tr><th style="width:100px;">카테고리</th><th>제목</th><th style="width:120px;">날짜</th><th style="width:120px;">작성자</th><th style="width:160px;text-align:right;">액션</th></tr>
            </thead>
            <tbody>
              ${items.map((n) => `
                <tr>
                  <td><span class="tag ${n.category === "important" ? "important" : ""}">${catLabel[n.category] || "공지"}</span></td>
                  <td>${escapeHtml(n.title)}</td>
                  <td>${n.date}</td>
                  <td>${escapeHtml(n.author)}</td>
                  <td><div class="actions">
                    <button class="btn btn-ghost btn-sm" data-edit-notice="${n.id}">수정</button>
                    <button class="btn btn-outline btn-sm" data-del-notice="${n.id}">삭제</button>
                  </div></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      async function renderContests() {
        main.innerHTML = `<p style="padding:40px 0;color:var(--muted);">불러오는 중…</p>`;
        const items = await window.IAYA.getContests();
        main.innerHTML = `
          <div class="page-head">
            <h2>대회 관리</h2>
            <button class="btn btn-primary btn-sm" data-new-contest>+ 새 대회</button>
          </div>
          <table class="table">
            <thead>
              <tr><th>대회명</th><th style="width:100px;">상태</th><th style="width:160px;">부문</th><th style="width:200px;">기간</th><th style="width:160px;text-align:right;">액션</th></tr>
            </thead>
            <tbody>
              ${items.map((c) => `
                <tr>
                  <td>${escapeHtml(c.title)}</td>
                  <td><span class="status-badge ${c.status}">${statusLabel[c.status]}</span></td>
                  <td>${escapeHtml(c.category)}</td>
                  <td>${escapeHtml(c.period)}</td>
                  <td><div class="actions">
                    <button class="btn btn-ghost btn-sm" data-edit-contest="${c.id}">수정</button>
                    <button class="btn btn-outline btn-sm" data-del-contest="${c.id}">삭제</button>
                  </div></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      async function renderUsers() {
        main.innerHTML = `<p style="padding:40px 0;color:var(--muted);">불러오는 중…</p>`;
        const users = await window.IAYA.getUsers();
        main.innerHTML = `
          <div class="page-head">
            <h2>회원 관리</h2>
            <p style="color:var(--muted);font-size:13px;">총 ${users.length}명</p>
          </div>
          <table class="table">
            <thead>
              <tr><th>보호자</th><th>이메일</th><th style="width:120px;">자녀</th><th style="width:100px;">자녀 출생</th><th style="width:80px;">국가</th><th style="width:90px;">역할</th><th style="width:120px;">가입일</th><th style="width:90px;text-align:right;">액션</th></tr>
            </thead>
            <tbody>
              ${users.map((u) => `
                <tr>
                  <td>${escapeHtml(u.name || "-")}</td>
                  <td>${escapeHtml(u.email)}</td>
                  <td>${escapeHtml(u.childName || "-")}</td>
                  <td>${u.childBirthYear || "-"}</td>
                  <td>${escapeHtml(u.country || "-")}</td>
                  <td><span class="status-badge ${u.role === "admin" ? "upcoming" : ""}">${u.role === "admin" ? "관리자" : "회원"}</span></td>
                  <td>${u.createdAt ? u.createdAt.slice(0, 10) : "-"}</td>
                  <td><div class="actions">
                    ${u.role === "admin" ? '' : `<button class="btn btn-outline btn-sm" data-del-user="${u.id}">삭제</button>`}
                  </div></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      // Event delegation for admin actions.
      main.addEventListener("click", async (e) => {
        const t = e.target;
        if (t.matches("[data-new-notice]")) await openNoticeModal();
        else if (t.matches("[data-edit-notice]")) await openNoticeModal(t.dataset.editNotice);
        else if (t.matches("[data-del-notice]")) await delNotice(t.dataset.delNotice);
        else if (t.matches("[data-new-contest]")) await openContestModal();
        else if (t.matches("[data-edit-contest]")) await openContestModal(t.dataset.editContest);
        else if (t.matches("[data-del-contest]")) await delContest(t.dataset.delContest);
        else if (t.matches("[data-del-user]")) await delUser(t.dataset.delUser);
      });

      // Notice modal.
      async function openNoticeModal(id) {
        editingNoticeId = id || null;
        const modal = noticeModal;
        modal.querySelector("[data-title]").textContent = id ? "공지 수정" : "공지 작성";
        const n = id ? await window.IAYA.getNotice(id) : null;
        modal.querySelector("[data-n-title]").value = n ? n.title : "";
        modal.querySelector("[data-n-cat]").value = n ? n.category : "notice";
        modal.querySelector("[data-n-date]").value = n ? n.date : new Date().toISOString().slice(0, 10);
        modal.querySelector("[data-n-body]").value = n ? n.body : "";
        modal.classList.add("open");
      }
      noticeModal.addEventListener("click", async (e) => {
        if (e.target === noticeModal || e.target.matches("[data-close]")) noticeModal.classList.remove("open");
        if (e.target.matches("[data-n-save]")) await saveNoticeAction();
      });
      async function saveNoticeAction() {
        const title = noticeModal.querySelector("[data-n-title]").value.trim();
        if (!title) { alert("제목을 입력해 주세요."); return; }
        const payload = {
          id: editingNoticeId || ("n-" + Date.now().toString(36)),
          category: noticeModal.querySelector("[data-n-cat]").value,
          title,
          date: noticeModal.querySelector("[data-n-date]").value,
          body: noticeModal.querySelector("[data-n-body]").value.trim(),
          author: user.name,
        };
        try {
          await window.IAYA.saveNotice(payload);
        } catch (err) {
          alert("저장 실패: " + err.message);
          return;
        }
        noticeModal.classList.remove("open");
        await renderNotices();
      }
      async function delNotice(id) {
        if (!confirm("이 공지를 삭제할까요?")) return;
        try {
          await window.IAYA.deleteNotice(id);
        } catch (err) {
          alert("삭제 실패: " + err.message);
          return;
        }
        await renderNotices();
      }

      // Contest modal.
      async function openContestModal(id) {
        editingContestId = id || null;
        const items = await window.IAYA.getContests();
        const c = id ? items.find((x) => x.id === id) : null;
        contestModal.querySelector("[data-title]").textContent = id ? "대회 수정" : "대회 등록";
        contestModal.querySelector("[data-c-title]").value = c ? c.title : "";
        contestModal.querySelector("[data-c-cat]").value = c ? c.category : "";
        contestModal.querySelector("[data-c-status]").value = c ? c.status : "open";
        contestModal.querySelector("[data-c-period]").value = c ? c.period : "";
        contestModal.querySelector("[data-c-award]").value = c ? c.award : "";
        contestModal.querySelector("[data-c-summary]").value = c ? c.summary : "";
        contestModal.querySelector("[data-c-detail]").value = c ? c.detail : "";
        contestModal.classList.add("open");
      }
      contestModal.addEventListener("click", async (e) => {
        if (e.target === contestModal || e.target.matches("[data-close]")) contestModal.classList.remove("open");
        if (e.target.matches("[data-c-save]")) await saveContestAction();
      });
      async function saveContestAction() {
        const title = contestModal.querySelector("[data-c-title]").value.trim();
        if (!title) { alert("대회명을 입력해 주세요."); return; }
        const payload = {
          id: editingContestId || ("c-" + Date.now().toString(36)),
          title,
          kicker: "IAYA Program",
          status: contestModal.querySelector("[data-c-status]").value,
          category: contestModal.querySelector("[data-c-cat]").value.trim(),
          period: contestModal.querySelector("[data-c-period]").value.trim(),
          award: contestModal.querySelector("[data-c-award]").value.trim(),
          summary: contestModal.querySelector("[data-c-summary]").value.trim(),
          detail: contestModal.querySelector("[data-c-detail]").value.trim(),
          cover: "primary",
        };
        try {
          await window.IAYA.saveContest(payload);
        } catch (err) {
          alert("저장 실패: " + err.message);
          return;
        }
        contestModal.classList.remove("open");
        await renderContests();
      }
      async function delContest(id) {
        if (!confirm("이 대회를 삭제할까요?")) return;
        try {
          await window.IAYA.deleteContest(id);
        } catch (err) {
          alert("삭제 실패: " + err.message);
          return;
        }
        await renderContests();
      }

      async function delUser(id) {
        if (!confirm("이 회원을 삭제할까요? (프로필만 삭제됨, Supabase Auth 계정은 대시보드에서 별도 삭제 필요)")) return;
        try {
          await window.IAYA.deleteUser(id);
        } catch (err) {
          alert("삭제 실패: " + err.message);
          return;
        }
        await renderUsers();
      }

      // ── Rich toolbar: 텍스트에어리어의 커서 위치에 HTML 스니펫 삽입 ──
      // 각 툴 버튼의 data-tool 값에 해당하는 템플릿을 넣어준다.
      function insertAtCursor(textarea, snippet) {
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const before = textarea.value.slice(0, start);
        const after = textarea.value.slice(end);
        const selected = textarea.value.slice(start, end);
        const withSel = snippet.replace("__SEL__", selected || "");
        textarea.value = before + withSel + after;
        textarea.focus();
        const pos = start + withSel.length;
        textarea.selectionStart = textarea.selectionEnd = pos;
      }

      // 파일 업로드는 비동기라 별도 처리 (아래 클릭 핸들러에서 취급).
      function toolSnippet(tool) {
        switch (tool) {
          case "p": return "\n<p>__SEL__</p>\n";
          case "h3": return "\n<h3>__SEL__</h3>\n";
          case "b": return "<strong>__SEL__</strong>";
          case "br": return "<br>\n";
          case "ul":
            return "\n<ul>\n  <li>__SEL__</li>\n  <li></li>\n</ul>\n";
          case "a": {
            const url = prompt("링크 주소(URL)를 입력하세요.", "https://");
            if (!url) return "";
            return `<a href="${url}" target="_blank">__SEL__</a>`;
          }
          case "table": {
            const rowsStr = prompt("행 수(제목행 포함)를 입력하세요.", "3");
            const colsStr = prompt("열 수를 입력하세요.", "3");
            const rows = Math.max(2, parseInt(rowsStr, 10) || 3);
            const cols = Math.max(1, parseInt(colsStr, 10) || 3);
            let html = "\n<table>\n  <thead>\n    <tr>";
            for (let c = 0; c < cols; c++) html += `<th>제목${c + 1}</th>`;
            html += "</tr>\n  </thead>\n  <tbody>";
            for (let r = 0; r < rows - 1; r++) {
              html += "\n    <tr>";
              for (let c = 0; c < cols; c++) html += `<td>내용</td>`;
              html += "</tr>";
            }
            html += "\n  </tbody>\n</table>\n";
            return html;
          }
          default: return "";
        }
      }

      // 이미지 업로드용 숨은 file input (동적 생성).
      async function uploadImageAndInsert(textarea) {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.style.display = "none";
        document.body.appendChild(input);
        input.click();

        input.addEventListener("change", async () => {
          const file = input.files && input.files[0];
          input.remove();
          if (!file) return;

          // 파일명 안전화 + 유니크 prefix로 충돌 방지.
          const ext = (file.name.split(".").pop() || "png").toLowerCase();
          const path = `notice/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;

          const { error: upErr } = await window.sb.storage
            .from("notice-images")
            .upload(path, file, { cacheControl: "3600", upsert: false });
          if (upErr) {
            alert("이미지 업로드 실패: " + upErr.message);
            return;
          }
          const { data } = window.sb.storage.from("notice-images").getPublicUrl(path);
          const url = data.publicUrl;
          const alt = file.name.replace(/\.[^.]+$/, "");
          insertAtCursor(textarea, `\n<img src="${url}" alt="${alt}" style="max-width:100%;height:auto;">\n`);
        });
      }

      // 모달 안 툴바 버튼 위임 처리.
      document.addEventListener("click", async (e) => {
        const btn = e.target.closest(".rich-toolbar [data-tool]");
        if (!btn) return;
        e.preventDefault();
        const toolbar = btn.closest(".rich-toolbar");
        const targetAttr = toolbar.dataset.toolbarFor;
        const textarea = document.querySelector(`textarea[${targetAttr}]`);
        if (!textarea) return;

        // 이미지는 비동기 파일 업로드로 별도 처리.
        if (btn.dataset.tool === "img") {
          await uploadImageAndInsert(textarea);
          return;
        }

        const snippet = toolSnippet(btn.dataset.tool);
        if (!snippet) return;
        insertAtCursor(textarea, snippet);
      });

      // Initial view.
      await render("dashboard");
    })();
  </script>
</body>
</html>
