<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>회원가입 | IAYA</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-nav="signup">
  <div data-header></div>

  <main>
    <div class="form-wrap">
      <div class="form-card">
        <h1>회원가입</h1>
        <p class="sub">아이의 이야기를 위한 IAYA 회원가입은 보호자가 진행합니다.</p>

        <div class="alert alert-danger" id="err" style="display:none;"></div>

        <form id="signup-form" novalidate>
          <div class="field" id="f-name">
            <label for="name">보호자 이름</label>
            <input id="name" name="name" type="text" placeholder="예: 김보호" required />
            <div class="err">보호자 이름을 입력해 주세요.</div>
          </div>

          <div class="field" id="f-email">
            <label for="email">보호자 이메일</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
            <div class="err">올바른 이메일 형식을 입력해 주세요.</div>
          </div>

          <div class="field" id="f-child">
            <label for="childName">자녀 이름 (또는 애칭)</label>
            <input id="childName" name="childName" type="text" placeholder="예: 하늘이" required />
            <div class="err">자녀 이름 또는 애칭을 입력해 주세요.</div>
          </div>

          <div class="form-row">
            <div class="field" id="f-birth">
              <label for="birthYear">자녀 출생 연도</label>
              <input id="birthYear" name="birthYear" type="number" min="2018" max="2025" placeholder="예: 2021" required />
              <div class="hint">미취학 아동(만 3~7세)을 대상으로 합니다.</div>
              <div class="err">미취학 아동(만 3~7세)만 가입 가능합니다.</div>
            </div>
            <div class="field" id="f-country">
              <label for="country">국가</label>
              <select id="country" name="country" required>
                <option value="">선택</option>
                <option value="KR">대한민국</option>
                <option value="JP">일본</option>
                <option value="US">미국</option>
                <option value="FR">프랑스</option>
                <option value="BR">브라질</option>
                <option value="KE">케냐</option>
                <option value="OTHER">기타</option>
              </select>
              <div class="err">국가를 선택해 주세요.</div>
            </div>
          </div>

          <div class="field" id="f-pw">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" placeholder="8자 이상" required />
            <div class="hint">영문·숫자 포함 8자 이상</div>
            <div class="err">8자 이상, 영문과 숫자를 포함해 주세요.</div>
          </div>

          <div class="field" id="f-pw2">
            <label for="password2">비밀번호 확인</label>
            <input id="password2" name="password2" type="password" required />
            <div class="err">비밀번호가 일치하지 않습니다.</div>
          </div>

          <div class="field" id="f-agree" style="display:flex;align-items:center;gap:8px;">
            <input id="agree" name="agree" type="checkbox" style="width:auto;" required />
            <label for="agree" style="margin:0;">이용약관 및 개인정보 처리방침에 동의합니다.</label>
          </div>

          <button class="btn btn-primary btn-block" type="submit">회원가입</button>
        </form>

        <div class="form-footer">
          이미 계정이 있으신가요? <a href="login.html">로그인</a>
        </div>
      </div>
    </div>
  </main>

  <div data-footer></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    (function () {
      const form = document.getElementById("signup-form");
      const errBox = document.getElementById("err");

      function setError(id, has) {
        const el = document.getElementById(id);
        if (has) el.classList.add("error");
        else el.classList.remove("error");
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        errBox.style.display = "none";

        const name = form.name.value.trim();
        const email = form.email.value.trim();
        const childName = form.childName.value.trim();
        const birthYear = Number(form.birthYear.value);
        const country = form.country.value;
        const pw = form.password.value;
        const pw2 = form.password2.value;
        const agree = form.agree.checked;

        let hasError = false;
        setError("f-name", !name);
        if (!name) hasError = true;

        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        setError("f-email", !emailOk);
        if (!emailOk) hasError = true;

        setError("f-child", !childName);
        if (!childName) hasError = true;

        const year = new Date().getFullYear();
        const age = year - birthYear;
        const birthOk = birthYear && age >= 3 && age <= 7;
        setError("f-birth", !birthOk);
        if (!birthOk) hasError = true;

        setError("f-country", !country);
        if (!country) hasError = true;

        const pwOk = pw.length >= 8 && /[A-Za-z]/.test(pw) && /\d/.test(pw);
        setError("f-pw", !pwOk);
        if (!pwOk) hasError = true;

        const pw2Ok = pw && pw === pw2;
        setError("f-pw2", !pw2Ok);
        if (!pw2Ok) hasError = true;

        if (!agree) {
          errBox.textContent = "이용약관에 동의해 주세요.";
          errBox.style.display = "block";
          hasError = true;
        }

        if (hasError) return;

        const res = window.Auth.register({
          name, email, password: pw, country,
          childName, childBirthYear: birthYear,
        });
        if (!res.ok) {
          errBox.textContent = res.error;
          errBox.style.display = "block";
          return;
        }
        alert("회원가입이 완료되었습니다. IAYA에 오신 것을 환영합니다.");
        location.href = "index.html";
      });
    })();
  </script>
</body>
</html>
