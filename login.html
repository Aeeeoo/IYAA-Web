<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>로그인 | IAYA</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-nav="login">
  <div data-header></div>

  <main>
    <div class="form-wrap">
      <div class="form-card">
        <h1>로그인</h1>
        <p class="sub">IAYA 회원 서비스에 로그인하세요.</p>

        <div class="alert alert-danger" id="err" style="display:none;"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">이메일</label>
            <input id="email" type="email" placeholder="you@example.com" required autocomplete="username" />
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" required autocomplete="current-password" />
          </div>
          <button class="btn btn-primary btn-block" type="submit">로그인</button>
        </form>

        <div class="form-footer">
          아직 회원이 아니신가요? <a href="signup.html">회원가입</a>
          <div style="margin-top:10px; font-size:13px;">
            인증 메일을 못 받으셨나요? <a href="#" id="resend-link">인증 메일 다시 받기</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div data-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    (function () {
      const form = document.getElementById("login-form");
      const errBox = document.getElementById("err");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errBox.style.display = "none";
        const email = form.email.value.trim();
        const password = form.password.value;
        const res = await window.Auth.login(email, password);
        if (!res.ok) {
          errBox.textContent = res.error;
          errBox.style.display = "block";
          return;
        }
        if (res.user.role === "admin") {
          location.href = "admin.html";
        } else {
          location.href = "index.html";
        }
      });

      // 인증 메일 재발송 — email 필드에 입력된 주소로 발송.
      document.getElementById("resend-link").addEventListener("click", async (e) => {
        e.preventDefault();
        errBox.style.display = "none";
        const email = form.email.value.trim();
        if (!email) {
          errBox.textContent = "이메일 주소를 먼저 입력해주세요.";
          errBox.style.display = "block";
          return;
        }
        const res = await window.Auth.resendConfirmation(email);
        errBox.className = res.ok ? "alert alert-info" : "alert alert-danger";
        errBox.textContent = res.ok
          ? "인증 메일을 다시 발송했습니다. 메일함(스팸함 포함)을 확인해주세요."
          : (res.error || "재발송에 실패했습니다.");
        errBox.style.display = "block";
      });
    })();
  </script>
</body>
</html>
