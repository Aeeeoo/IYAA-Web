<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Programs | International Association for Young Authors (IAYA) · 국제어린이작가협회</title>
  <meta name="description" content="International Association for Young Authors (IAYA, 국제어린이작가협회)가 진행하는 미취학 아동 대상 창작·스토리텔링 프로그램과 대회를 안내합니다." />
  <link rel="canonical" href="https://iaya.world/contest.html" />
  <meta property="og:site_name" content="International Association for Young Authors (IAYA)" />
  <meta property="og:title" content="Programs | International Association for Young Authors (IAYA)" />
  <meta property="og:description" content="IAYA(국제어린이작가협회) 대회 안내 — 미취학 아동을 위한 창작 프로그램." />
  <meta property="og:url" content="https://iaya.world/contest.html" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://iaya.world/logo.png" />
  <meta property="og:locale" content="ko_KR" />
  <meta name="twitter:card" content="summary" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-nav="contest">
  <div data-header></div>

  <main>
    <section class="hero" style="padding-bottom: 24px;">
      <div class="container">
        <span class="eyebrow">Programs</span>
        <h1>대회 안내</h1>
      </div>
    </section>

    <section class="section" style="padding-top: 24px;">
      <div class="container">
        <div class="grid grid-2" data-contest-list></div>
      </div>
    </section>
  </main>

  <div data-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    (async function () {
      const listEl = document.querySelector("[data-contest-list]");
      const statusLabel = { open: "진행 중", upcoming: "Coming Soon", closed: "종료" };
      const items = await window.IAYA.getContests();

      if (!items.length) {
        listEl.innerHTML = `
          <div class="card" style="grid-column: 1 / -1; text-align:center; padding:60px 24px;">
            <div class="meta">Programs</div>
            <h3>Coming Soon</h3>
            <p style="margin-top:8px;">프로그램을 준비하고 있습니다.</p>
          </div>`;
        return;
      }

      listEl.innerHTML = items
        .map((c) => {
          const showCat = c.category && c.category !== "-";
          const showPeriod = c.period && c.period !== "-";
          return `
          <a class="contest-card" href="contest-detail.html?id=${encodeURIComponent(c.id)}">
            <div class="cover ${c.cover === "alt" ? "alt" : c.cover === "dark" ? "dark" : ""}">
              <div class="kicker">${escapeHtml(c.kicker)}</div>
              <div class="title">${escapeHtml(c.title)}</div>
            </div>
            <div class="body">
              <div class="meta">
                <span class="status-badge ${c.status}">${statusLabel[c.status] || "Coming Soon"}</span>
                ${showCat ? `<span>${escapeHtml(c.category)}</span>` : ""}
                ${showPeriod ? `<span>${escapeHtml(c.period)}</span>` : ""}
              </div>
              <p>${escapeHtml(c.summary)}</p>
            </div>
          </a>`;
        })
        .join("");
    })();
  </script>
</body>
</html>
